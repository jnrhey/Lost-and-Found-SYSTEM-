<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CvSU Bacoor - Login</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cvsu-green: #006633;
            --cvsu-gold: #FFC72C;
        }
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .bg-cvsu {
            background-color: var(--cvsu-green);
        }
        .btn-cvsu {
            background-color: var(--cvsu-green);
            color: white;
        }
        .btn-cvsu:hover {
            background-color: #005228;
            color: white;
        }
        .form-control:focus {
            border-color: var(--cvsu-green);
            box-shadow: 0 0 0 0.25rem rgba(0, 102, 51, 0.25);
        }
        .text-cvsu {
            color: var(--cvsu-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-login p-4">
                    <div class="text-center mb-4">
                        <div class="bg-cvsu text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                            <i class="fa-solid fa-graduation-cap fa-2x"></i>
                        </div>
                        <h3 class="fw-bold text-dark">CvSU Bacoor</h3>
                        <p class="text-muted small">Lost & Found Portal - Student Login</p>
                    </div>
                    
                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">CvSU Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="name@cvsu.edu.ph" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label small text-muted" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="small text-cvsu text-decoration-none fw-semibold">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-cvsu w-100 py-2 fw-semibold mb-3">Login</button>
                        <div class="text-center">
                            <p class="small text-muted">Don't have an account? <a href="register.html" class="text-cvsu text-decoration-none fw-semibold">Register here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
