<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CvSU Bacoor - Register Account</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cvsu-green: #006633;
            --cvsu-gold: #FFC72C;
        }
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 3rem;
            padding-bottom: 3rem;
        }
        .card-register {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .bg-cvsu {
            background-color: var(--cvsu-green);
        }
        .btn-cvsu {
            background-color: var(--cvsu-green);
            color: white;
        }
        .btn-cvsu:hover {
            background-color: #005228;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--cvsu-green);
            box-shadow: 0 0 0 0.25rem rgba(0, 102, 51, 0.25);
        }
        .text-cvsu {
            color: var(--cvsu-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-register p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="bg-cvsu text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                            <i class="fa-solid fa-user-plus fa-2x"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Create Account</h3>
                        <p class="text-muted small">Join CvSU Bacoor Lost &amp; Found Portal</p>
                    </div>
                    
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label small fw-semibold">First Name</label>
                                <input type="text" class="form-control" id="firstName" placeholder="Jan Rhey" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label small fw-semibold">Last Name</label>
                                <input type="text" class="form-control" id="lastName" placeholder="Paaño" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="studentNumber" class="form-label small fw-semibold">Student Number</label>
                            <input type="text" class="form-control" id="studentNumber" placeholder="202X-XXXXX" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">CvSU Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="name@cvsu.edu.ph" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label small fw-semibold">Department / Program</label>
                            <select class="form-select" id="department" required>
                                <option selected disabled value="">Choose your program...</option>
                                <option value="BSCS">BS Computer Science (BSCS)</option>
                                <option value="BSIT">BS Information Technology (BSIT)</option>
                                <option value="BBM">BS Business Management (BBM)</option>
                                <option value="BEEd">Bachelor of Elementary Education (BEEd)</option>
                                <option value="BSEd">Bachelor of Secondary Education (BSEd)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label small fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-cvsu w-100 py-2 fw-semibold mb-3">Register Account</button>
                        
                        <div class="text-center">
                            <p class="small text-muted">Already have an account? <a href="login.html" class="text-cvsu text-decoration-none fw-semibold">Login here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
